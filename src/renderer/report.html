<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>Flow Report</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="window.css" />
    <link rel="stylesheet" href="report.css" />
  </head>
  <body>
    <h1><span class="gradient-text">Flow Report</span></h1>
    <p class="subtitle">Your last 7 days of dictation. Counts only: your words are never stored.</p>

    <div class="tiles">
      <div class="tile">
        <div class="value" id="words">0</div>
        <div class="name">words dictated</div>
      </div>
      <div class="tile">
        <div class="value" id="wpm">0</div>
        <div class="name" id="wpmName">words per minute</div>
      </div>
      <div class="tile">
        <div class="value" id="saved">0</div>
        <div class="name">minutes saved</div>
      </div>
    </div>

    <div class="card chart-card">
      <div class="card-title">Words per day</div>
      <div class="chart" id="chart"></div>
    </div>

    <div class="card">
      <div class="card-title">Your filler words</div>
      <ol class="fillers" id="fillers"></ol>
    </div>

    <script src="report.js"></script>
  </body>
</html>
